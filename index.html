<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panda Kod Satışı</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#050509;
    --card:#101018;
    --purple:#8d35ff;
    --purple2:#c05cff;
    --pink:#ff2d9b;
    --cyan:#00f5ff;
    --green:#37ff78;
    --yellow:#ffd21c;
    --white:#fff;
    --muted:#aaa8b8;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 10% 5%,rgba(138,43,226,.20),transparent 24%),
        radial-gradient(circle at 90% 15%,rgba(255,0,150,.16),transparent 23%),
        radial-gradient(circle at 50% 80%,rgba(0,220,255,.08),transparent 28%),
        #050509;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px);
    background-size:80px 80px;
    z-index:-1;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1180px,94%);
    margin:auto;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    height:76px;
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,5,10,.84);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
}

.nav-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo-panda{
    width:46px;
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    background:linear-gradient(145deg,#fff,#aaa);
    box-shadow:
        0 0 12px rgba(255,255,255,.3),
        0 0 25px rgba(150,40,255,.4);
}

.logo-text strong{
    display:block;
    color:#ffd21c;
    font-size:18px;
    font-weight:1000;
    letter-spacing:1px;
}

.logo-text span{
    display:block;
    font-size:12px;
    font-weight:900;
    color:#fff;
    margin-top:2px;
}

.nav-links{
    display:flex;
    gap:5px;
    padding:5px;
    background:#101018;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
}

.nav-links button{
    border:0;
    background:transparent;
    color:#aaa8b8;
    padding:9px 13px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
}

.nav-links button:hover,
.nav-links button.active{
    background:#20172f;
    color:#fff;
    box-shadow:0 0 15px rgba(142,53,255,.15);
}

.account-btn{
    border:1px solid #ffd21c;
    background:linear-gradient(135deg,#ffe45a,#ffad00);
    color:#111;
    padding:11px 14px;
    border-radius:10px;
    font-size:11px;
    font-weight:1000;
    box-shadow:0 0 20px rgba(255,210,28,.18);
}

.mobile-menu{
    display:none;
    border:0;
    background:#191525;
    color:#fff;
    width:39px;
    height:39px;
    border-radius:9px;
    font-size:20px;
}

/* =========================
   HERO / PANDA
========================= */

.hero{
    margin-top:18px;
}

.hero-box{
    position:relative;
    min-height:390px;
    overflow:hidden;
    border-radius:22px;
    border:1px solid rgba(178,68,255,.55);
    background:
        radial-gradient(circle at 70% 45%,rgba(157,48,255,.30),transparent 28%),
        radial-gradient(circle at 95% 80%,rgba(255,20,170,.18),transparent 25%),
        linear-gradient(115deg,#0c0715,#100a1d 50%,#09070e);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 0 60px rgba(143,45,255,.08);
}

/* neon border */
.hero-box:before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:24px;
    border:2px solid transparent;
    background:
        linear-gradient(90deg,
        #8d35ff,
        #ff2d9b,
        #00f5ff,
        #8d35ff) border-box;
    -webkit-mask:
        linear-gradient(#000 0 0) padding-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:.7;
    animation:borderMove 5s linear infinite;
    pointer-events:none;
}

@keyframes borderMove{
    0%{filter:hue-rotate(0deg)}
    100%{filter:hue-rotate(360deg)}
}

.hero-content{
    position:relative;
    z-index:5;
    width:60%;
    padding:45px 40px;
}

.neon-symbols{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.neon-symbol{
    position:absolute;
    font-weight:1000;
    font-size:32px;
    opacity:.85;
    filter:drop-shadow(0 0 8px currentColor)
           drop-shadow(0 0 20px currentColor);
    animation:neonFloat 4s ease-in-out infinite;
}

.neon-symbol.s1{
    color:#ff2d9b;
    left:6%;
    top:13%;
}

.neon-symbol.s2{
    color:#00f5ff;
    left:47%;
    top:10%;
    animation-delay:1s;
}

.neon-symbol.s3{
    color:#ffd21c;
    left:40%;
    bottom:12%;
    animation-delay:1.7s;
}

.neon-symbol.s4{
    color:#8d35ff;
    right:34%;
    top:20%;
    animation-delay:2.2s;
}

@keyframes neonFloat{
    0%,100%{
        transform:translateY(0) rotate(-4deg) scale(1);
    }
    50%{
        transform:translateY(-13px) rotate(5deg) scale(1.08);
    }
}

.hero-badge{
    display:inline-flex;
    padding:8px 13px;
    border-radius:30px;
    border:1px solid rgba(0,245,255,.4);
    background:rgba(0,245,255,.06);
    color:#9dfaff;
    font-size:9px;
    font-weight:900;
    box-shadow:
        0 0 14px rgba(0,245,255,.12),
        inset 0 0 14px rgba(0,245,255,.04);
    margin-bottom:16px;
}

.hero-title{
    white-space:nowrap;
    font-size:45px;
    line-height:1;
    letter-spacing:-2px;
    font-weight:1000;
    text-transform:uppercase;
}

.hero-title .panda-word{
    color:#fff;
    text-shadow:
        0 0 8px #fff,
        0 0 20px rgba(255,255,255,.5);
}

.hero-title .code-word{
    color:#ffd21c;
    text-shadow:
        0 0 7px #ffd21c,
        0 0 20px #ff8c00,
        0 0 38px rgba(255,210,28,.45);
}

.hero-title .sale-word{
    color:#ff42b3;
    text-shadow:
        0 0 8px #ff42b3,
        0 0 20px #ff1597,
        0 0 40px rgba(255,45,155,.45);
}

.hero-line{
    width:270px;
    height:3px;
    margin-top:14px;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        #8d35ff,
        #ff2d9b,
        #ffd21c,
        transparent
    );
    box-shadow:0 0 14px rgba(255,45,155,.6);
}

.hero p{
    max-width:470px;
    margin-top:17px;
    color:#aaa8b8;
    font-size:12px;
    line-height:1.6;
}

.hero-buttons{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.primary-btn,
.secondary-btn{
    padding:12px 18px;
    border-radius:10px;
    font-size:11px;
    font-weight:1000;
}

.primary-btn{
    border:1px solid #ffd21c;
    color:#111;
    background:linear-gradient(135deg,#ffe45a,#ffad00);
    box-shadow:0 0 20px rgba(255,210,28,.18);
}

.secondary-btn{
    border:1px solid rgba(255,255,255,.13);
    color:#fff;
    background:#171321;
}

.primary-btn:hover,
.secondary-btn:hover{
    transform:translateY(-2px);
}

/* Panda 5D */
.panda-stage{
    position:absolute;
    right:3%;
    top:0;
    width:42%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.panda-glow{
    position:absolute;
    width:270px;
    height:270px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        rgba(180,60,255,.38),
        rgba(92,30,200,.12) 45%,
        transparent 70%);
    filter:blur(10px);
    animation:pandaGlow 3s ease-in-out infinite;
}

@keyframes pandaGlow{
    0%,100%{
        transform:scale(.95);
        opacity:.7;
    }
    50%{
        transform:scale(1.1);
        opacity:1;
    }
}

.panda-ring{
    position:absolute;
    width:270px;
    height:270px;
    border-radius:50%;
    border:2px solid rgba(0,245,255,.25);
    box-shadow:
        0 0 20px rgba(0,245,255,.18),
        inset 0 0 30px rgba(255,45,155,.12);
    animation:ringRotate 12s linear infinite;
}

.panda-ring:before{
    content:"777   ♦   ♠   777";
    position:absolute;
    inset:-18px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffd21c;
    font-size:11px;
    font-weight:1000;
    letter-spacing:7px;
    text-shadow:0 0 10px #ffd21c;
}

@keyframes ringRotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.panda-emoji{
    position:relative;
    z-index:5;
    font-size:145px;
    filter:
        drop-shadow(0 0 10px #fff)
        drop-shadow(0 0 25px #9c3cff)
        drop-shadow(0 0 45px #ff2d9b);
    animation:pandaFloat 3s ease-in-out infinite;
}

@keyframes pandaFloat{
    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }
    50%{
        transform:translateY(-12px) rotate(2deg);
    }
}

.casino-badge{
    position:absolute;
    z-index:7;
    padding:7px 11px;
    border-radius:9px;
    font-weight:1000;
    font-size:15px;
    background:rgba(5,5,10,.75);
    backdrop-filter:blur(8px);
    animation:badgeFloat 4s ease-in-out infinite;
}

.casino-badge.one{
    right:18%;
    top:18%;
    color:#ffd21c;
    border:1px solid #ffd21c;
    box-shadow:0 0 18px rgba(255,210,28,.35);
}

.casino-badge.two{
    left:10%;
    bottom:20%;
    color:#00f5ff;
    border:1px solid #00f5ff;
    box-shadow:0 0 18px rgba(0,245,255,.30);
    animation-delay:1s;
}

.casino-badge.three{
    right:5%;
    bottom:22%;
    color:#ff42b3;
    border:1px solid #ff42b3;
    box-shadow:0 0 18px rgba(255,45,155,.30);
    animation-delay:1.5s;
}

@keyframes badgeFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
}

/* =========================
   BENEFITS
========================= */

.benefits{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid rgba(255,255,255,.07);
    border-top:0;
    border-radius:0 0 16px 16px;
    background:#101018;
    overflow:hidden;
}

.benefit{
    padding:16px;
    display:flex;
    gap:9px;
    border-right:1px solid rgba(255,255,255,.06);
}

.benefit:last-child{
    border-right:0;
}

.benefit-icon{
    font-size:22px;
}

.benefit strong{
    display:block;
    font-size:11px;
    font-weight:1000;
    margin-bottom:4px;
}

.benefit span{
    color:#858293;
    font-size:9px;
    line-height:1.4;
}

/* =========================
   PACKAGES
========================= */

.packages-section{
    margin-top:20px;
    padding:20px;
    border:1px solid rgba(141,53,255,.25);
    border-radius:16px;
    background:rgba(12,11,20,.85);
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:15px;
}

.section-title h2{
    font-size:19px;
    font-weight:1000;
}

.section-title p{
    color:#858293;
    font-size:10px;
}

.packages{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.package{
    position:relative;
    overflow:hidden;
    padding:15px 10px;
    text-align:center;
    border-radius:13px;
    background:linear-gradient(150deg,#171124,#0d0c15);
    border:1px solid rgba(141,53,255,.5);
    transition:.25s;
}

.package:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.package:nth-child(2){
    border-color:#ffd21c;
}

.package:nth-child(3){
    border-color:#37ff78;
}

.package:nth-child(4){
    border-color:#ff2d9b;
}

.package-icon{
    font-size:32px;
    margin-bottom:5px;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.2));
}

.package h3{
    font-size:20px;
    font-weight:1000;
}

.package p{
    color:#8d899b;
    font-size:9px;
    margin:5px 0 11px;
}

.select-package{
    width:100%;
    border-radius:8px;
    padding:9px;
    border:1px solid #a34cff;
    background:#211238;
    color:#fff;
    font-size:10px;
    font-weight:1000;
}

.all-packages{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:7px;
}

.small-package{
    text-align:center;
    padding:10px 7px;
    background:#101018;
    border:1px solid rgba(255,255,255,.07);
    border-radius:9px;
}

.small-package strong{
    display:block;
    color:#ffd21c;
    font-size:14px;
    font-weight:1000;
}

.small-package span{
    display:block;
    color:#777485;
    font-size:8px;
    margin-top:3px;
}

.small-package button{
    width:100%;
    border:0;
    background:#21172f;
    color:#fff;
    border-radius:6px;
    padding:6px;
    margin-top:7px;
    font-size:9px;
}

/* =========================
   ACCOUNT
========================= */

.account-section{
    display:none;
    margin-top:20px;
    padding:17px;
    border-radius:15px;
    border:1px solid rgba(141,53,255,.3);
    background:#101018;
}

.account-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.account-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#211437;
    border:1px solid #9c3cff;
    box-shadow:0 0 18px rgba(156,60,255,.25);
}

.account-user h2{
    font-size:14px;
    font-weight:1000;
}

.account-user p{
    color:#777485;
    font-size:9px;
    margin-top:4px;
}

.logout{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    background:#21182e;
    color:#fff;
    font-size:10px;
}

.orders{
    margin-top:13px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;
    overflow:hidden;
}

.orders-head{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.06);
    display:flex;
    justify-content:space-between;
}

.orders-head h3{
    font-size:11px;
}

.orders-list{
    padding:8px;
}

.order{
    display:grid;
    grid-template-columns:50px 1.4fr 1fr 1fr;
    gap:10px;
    align-items:center;
    padding:10px;
    background:#14131e;
    border:1px solid rgba(255,255,255,.06);
    border-radius:9px;
    margin-bottom:6px;
}

.order-icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:#28133e;
    font-size:23px;
}

.order-title{
    font-size:10px;
    font-weight:1000;
}

.order-price{
    color:#ffd21c;
    font-size:15px;
    font-weight:1000;
    margin:3px 0;
}

.order-info{
    color:#777485;
    font-size:8px;
    line-height:1.5;
}

.status{
    color:#37ff78;
    font-size:8px;
    font-weight:1000;
}

/* =========================
   STATS
========================= */

.stats{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    overflow:hidden;
    background:#101018;
}

.stat{
    text-align:center;
    padding:15px;
    border-right:1px solid rgba(255,255,255,.06);
}

.stat:last-child{
    border:0;
}

.stat-icon{
    font-size:22px;
}

.stat strong{
    display:block;
    font-size:10px;
    margin-top:4px;
}

.stat span{
    color:#777485;
    font-size:8px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(12px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(480px,100%);
    max-height:92vh;
    overflow:auto;
    padding:20px;
    border-radius:18px;
    border:1px solid rgba(156,60,255,.45);
    background:
        radial-gradient(circle at 50% 0%,rgba(156,60,255,.13),transparent 40%),
        #111018;
    box-shadow:0 30px 90px #000;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.modal-head h2{
    font-size:18px;
    font-weight:1000;
}

.close{
    width:32px;
    height:32px;
    border:0;
    border-radius:8px;
    background:#231d31;
    color:#fff;
    font-size:19px;
}

/* AUTH */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    background:#09090f;
    padding:4px;
    border-radius:8px;
    margin-bottom:15px;
}

.tabs button{
    padding:9px;
    border:0;
    background:transparent;
    color:#777485;
    border-radius:6px;
    font-size:10px;
}

.tabs button.active{
    background:#281a3b;
    color:#fff;
}

.form-group{
    margin-bottom:11px;
}

.form-group label{
    display:block;
    color:#92909e;
    font-size:9px;
    margin-bottom:5px;
}

.input{
    width:100%;
    padding:11px;
    border-radius:8px;
    outline:0;
    border:1px solid rgba(255,255,255,.09);
    background:#0b0b11;
    color:#fff;
    font-size:11px;
}

.input:focus{
    border-color:#a64cff;
    box-shadow:0 0 0 3px rgba(166,76,255,.07);
}

.form-btn{
    width:100%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:linear-gradient(135deg,#ffe45a,#ffad00);
    color:#111;
    font-size:11px;
    font-weight:1000;
}

.error{
    display:none;
    color:#ff5c87;
    font-size:9px;
    margin-bottom:10px;
}

/* =========================
   PAYMENT
========================= */

.payment-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px;
    border-radius:11px;
    background:#19152a;
    border:1px solid rgba(156,60,255,.28);
    margin-bottom:12px;
}

.payment-summary small{
    display:block;
    color:#777485;
    font-size:8px;
}

.payment-summary strong{
    display:block;
    font-size:11px;
    margin-top:4px;
}

.amount{
    color:#ffd21c;
    font-size:21px;
    font-weight:1000;
    text-shadow:0 0 15px rgba(255,210,28,.25);
}

/* MODERN CARD */

.bank-card{
    position:relative;
    min-height:185px;
    overflow:hidden;
    padding:19px;
    border-radius:18px;
    background:
        radial-gradient(circle at 90% 20%,rgba(0,245,255,.20),transparent 23%),
        radial-gradient(circle at 10% 90%,rgba(255,45,155,.20),transparent 25%),
        linear-gradient(135deg,#241035,#7024c5 48%,#140b25);
    border:1px solid rgba(255,255,255,.20);
    box-shadow:
        0 20px 40px rgba(0,0,0,.4),
        0 0 35px rgba(141,53,255,.18);
}

.bank-card:before{
    content:"777   ♦   777";
    position:absolute;
    right:13px;
    bottom:13px;
    color:rgba(255,255,255,.13);
    font-size:18px;
    font-weight:1000;
    letter-spacing:4px;
}

.bank-top{
    display:flex;
    justify-content:space-between;
}

.bank-brand{
    font-size:13px;
    font-weight:1000;
}

.bank-brand span{
    color:#ffd21c;
}

.chip{
    width:39px;
    height:28px;
    border-radius:6px;
    background:linear-gradient(135deg,#eee,#999);
}

.card-number{
